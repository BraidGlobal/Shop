<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18172C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Build Braid — Shop (Connected Flow)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Roboto:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.34.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="assets/tokens.css?v=20260810c" />
  <style>
    :root {
      --deep-indigo: var(--bg-deep-indigo);
      --medium-purple: var(--bg-medium-purple);
      --dark-purple: var(--bg-dark-purple);
      --pure-white: var(--text-pure-white);
      --soft-lilac: var(--accent-lavender);
      --lavender: var(--accent-lavender);
      --deep-violet: var(--accent-deep-violet);
      --purple-border: var(--accent-lavender);
      --amber-orange: var(--warm-amber);

      --font-display: 'Gyst Variable', 'Playfair Display', Georgia, serif;
      --font-body: 'Roboto', system-ui, sans-serif;
      --font-ui: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--deep-indigo);
      color: var(--pure-white);
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
    }
    body::after { display: none; }

    .hint {
      font-family: var(--font-ui);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(200, 188, 246, 0.5);
      text-align: center;
      max-width: 90%;
      z-index: 1;
    }

    /* ============ App shell (full-bleed at all sizes) ============ */
    .device {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--deep-indigo);
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      position: relative;
      z-index: 1;
    }
    .device::after { display: none; }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      background: var(--deep-indigo);
    }

    /* Mockup chrome — not shown in the real responsive app */
    .hint { display: none; }
    .status-bar { display: none; }
    .home-indicator { display: none; }

    #scroll-container {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      overscroll-behavior-y: none; /* no rubber-band bounce — it flashed the backdrop over the hero nav */
    }
    /* Touch devices snap natively (the JS snap is desktop-only) */
    @media (pointer: coarse) {
      #scroll-container { scroll-snap-type: y mandatory; }
    }
    #scroll-container.snap-off { scroll-snap-type: none; }
    #scroll-container::-webkit-scrollbar { display: none; }

    #hero-section,
    .grid-state {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    /* ============ Status bar (sticky over everything) ============ */
    .status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      padding: 14px 24px 0;
      display: none; /* fake iPhone status bar — hidden in the real responsive app */
      justify-content: space-between;
      align-items: flex-start;
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 12px;
      color: var(--pure-white);
      z-index: 50;
      pointer-events: none;
    }
    .status-bar .right { display: flex; align-items: center; gap: 5px; }
    .status-bar i { font-size: 14px; }

    /* ============ STATE 01: Reels Hero ============ */
    #hero-section {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background: var(--medium-purple);
      overflow: hidden;
    }

    #reels-track {
      display: flex;
      width: 400%;
      height: 100%;
      transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reel-slide {
      width: 25%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-color: var(--medium-purple);
      position: relative;
    }

    /* Readability gradient overlay */
    .hero-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(24,23,44,0.55) 0%, rgba(24,23,44,0.05) 22%, rgba(24,23,44,0.1) 55%, rgba(24,23,44,0.85) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Carousel progress */
    .progress {
      position: absolute;
      top: 56px;
      left: 20px;
      right: 20px;
      display: flex;
      gap: 4px;
      z-index: 6;
    }
    .progress-seg {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--soft-lilac);
      border-radius: 999px;
    }

    /* Top nav over reels */
    .reels-nav {
      position: absolute;
      top: 80px;
      left: 0; right: 0;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 6;
    }
    .glass-circle {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(200, 188, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .glass-circle:active { background: rgba(255, 255, 255, 0.22); }

    /* Glass-pill brand badge (wider, holds the wordmark) */
    .glass-pill {
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(200, 188, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .glass-pill:active { background: rgba(255, 255, 255, 0.22); }

    .brand-logo {
      height: 46px;
      width: auto;
      display: block;
      filter: drop-shadow(0 1px 6px rgba(0, 0, 0, 0.35));
    }
    .brand-logo-sm { height: 42px; }

    .logo-b {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      color: var(--soft-lilac);
      letter-spacing: -0.02em;
    }
    .cart-btn i { color: var(--soft-lilac); font-size: 20px; }
    .cart-dot {
      position: absolute;
      top: 4px; right: 4px;
      width: 8px; height: 8px;
      background: var(--deep-violet);
      border-radius: 50%;
      border: 1.5px solid var(--deep-indigo);
      display: none;
    }
    .cart-dot.visible { display: block; }

    /* Tap zones */
    #touch-zone {
      position: absolute;
      top: 130px;
      left: 0; right: 0;
      bottom: 240px;
      display: flex;
      z-index: 4;
    }
    #tap-left, #tap-right { flex: 1; cursor: pointer; }

    /* Hero text */
    .hero-text {
      position: absolute;
      left: 32px;
      bottom: 140px;
      max-width: 260px;
      z-index: 5;
    }
    .live-dot {
      position: relative;
      width: 16px; height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .live-dot::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid var(--soft-lilac);
      border-radius: 50%;
      opacity: 0.7;
      animation: pulse 2.4s infinite ease-out;
    }
    .live-dot::after {
      content: '';
      width: 8px; height: 8px;
      background: var(--soft-lilac);
      border-radius: 50%;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      80% { transform: scale(1.9); opacity: 0; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    .display-headline {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 42px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--pure-white);
      margin: 0 0 10px;
    }
    .subline {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 14px;
      line-height: 1.45;
      color: rgba(255, 254, 254, 0.75);
      margin: 0;
    }

    /* Hamburger */
    .hamburger {
      position: absolute;
      right: 32px;
      bottom: 158px;
      width: 24px;
      height: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
      cursor: pointer;
    }
    .hamburger span {
      display: block;
      height: 1.5px;
      background: var(--soft-lilac);
      border-radius: 2px;
    }
    .hamburger span:nth-child(2) { width: 65%; align-self: flex-end; }

    /* Scroll affordance */
    #scroll-cue {
      position: absolute;
      bottom: 56px;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 5;
      animation: bounce 2.2s ease-in-out infinite;
      transition: opacity 0.3s;
      cursor: pointer;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    #scroll-cue .label {
      font-family: var(--font-ui);
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(255, 254, 254, 0.7);
    }
    #scroll-cue i { color: var(--soft-lilac); font-size: 18px; }

    /* ============ STATE 02: Sticky bar + Grid ============ */
    .grid-state {
      background: transparent;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: 56px;
    }

    .sticky-bar {
      position: sticky;
      top: 0;
      background: rgba(24, 23, 44, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(200, 188, 246, 0.25);
      padding: 56px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .sticky-bar .logo-b-sm {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--soft-lilac);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--soft-lilac);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
    }
    .sticky-bar h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      color: var(--pure-white);
      letter-spacing: -0.01em;
      margin: 0;
    }
    .cart-grid-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(200, 188, 246, 0.45);
      color: var(--soft-lilac);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }
    .cart-grid-btn i { font-size: 16px; }
    .cart-grid-btn .cart-dot { top: 0; right: 0; }

    /* Top-right cart button + count badge (header) */
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .cart-count-badge {
      position: absolute;
      top: -5px; right: -5px;
      min-width: 18px; height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--soft-lilac);
      color: var(--deep-indigo);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 10px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--deep-indigo);
    }
    .cart-count-badge.visible { display: flex; }
    @keyframes cart-bump { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
    .cart-bump { animation: cart-bump 380ms ease; }

    /* Grid heading */
    .grid-intro {
      padding: 22px 16px 8px;
    }
    .grid-intro h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.02em;
      color: var(--pure-white);
      margin: 0 0 4px;
    }
    .grid-intro p {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 13px;
      color: rgba(255, 254, 254, 0.6);
      margin: 0;
    }

    #product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 12px;
      padding: 16px;
    }

    .product-card {
      position: relative;
      background:
        linear-gradient(160deg,
          rgba(200, 188, 246, 0.14) 0%,
          rgba(56, 42, 77, 0.55) 35%,
          rgba(34, 30, 60, 0.6) 100%);
      border: 1px solid rgba(200, 188, 246, 0.22);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      box-shadow:
        0 14px 38px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    /* Subtle top sheen for a glass-surface highlight */
    .product-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 60%;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.07) 0%,
        transparent 100%);
      pointer-events: none;
      z-index: 3;
      border-radius: inherit;
      mix-blend-mode: screen;
    }
    .product-card:active { transform: scale(0.97); }
    .product-card:hover {
      transform: translateY(-3px);
      border-color: rgba(200, 188, 246, 0.5);
      box-shadow:
        0 22px 48px rgba(0, 0, 0, 0.5),
        0 6px 20px rgba(90, 25, 155, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-size: cover;
      background-position: center;
      background-color: var(--dark-purple);
    }
    .product-body { padding: 12px; }
    .product-name {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 14px;
      color: var(--pure-white);
      letter-spacing: -0.01em;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-price {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 15px;
      color: var(--soft-lilac);
      margin: 0 0 10px;
    }
    .add-btn {
      width: 100%;
      height: 34px;
      border-radius: var(--radius-pill);
      background: var(--deep-violet);
      color: var(--pure-white);
      border: none;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .add-btn:hover {
      background: #6B25B0;
      box-shadow: 0 0 0 1px var(--lavender), 0 0 16px rgba(200, 188, 246, 0.4);
    }
    .add-btn:active { transform: scale(0.96); }
    .add-btn.added { background: #2D7A4F; }
    .add-btn:disabled {
      background: rgba(255, 254, 254, 0.12);
      color: rgba(255, 254, 254, 0.45);
      cursor: not-allowed;
    }

    /* Live-inventory badges (fed by Shopify) */
    .product-card { position: relative; }
    .stock-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      background: rgba(24, 23, 44, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 144, 51, 0.5);
      color: var(--amber-orange);
      font-family: var(--font-ui);
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 2;
    }
    .stock-badge.out {
      border-color: rgba(255, 254, 254, 0.35);
      color: rgba(255, 254, 254, 0.75);
    }

    /* Scroll dots at end of grid */
    .scroll-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      padding: 16px 0 0;
    }
    .scroll-dots span {
      width: 4px; height: 4px;
      background: var(--soft-lilac);
      border-radius: 50%;
    }
    .scroll-dots span:nth-child(1) { opacity: 0.7; }
    .scroll-dots span:nth-child(2) { opacity: 0.5; }
    .scroll-dots span:nth-child(3) { opacity: 0.3; }

    /* Home indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      border-radius: 999px;
      background: var(--pure-white);
      opacity: 0.85;
      z-index: 60;
      pointer-events: none;
    }

    /* ============ Toast ============ */
    /* ============ Side Drawer ============ */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 320ms ease;
      border-radius: 44px;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: min(72%, 360px);
      background: rgba(90, 25, 155, 0.6);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border-left: 1px solid rgba(200, 188, 246, 0.25);
      box-shadow: -20px 0 50px rgba(0, 0, 0, 0.45);
      z-index: 85;
      transform: translateX(100%);
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 0 32px;
      overflow: hidden;
      border-top-right-radius: 44px;
      border-bottom-right-radius: 44px;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 22px 22px;
      border-bottom: 1px solid rgba(200, 188, 246, 0.18);
    }
    .drawer-header .brand-logo { height: 36px; }
    .drawer-close {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(200, 188, 246, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: var(--soft-lilac);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .drawer-close:hover { background: rgba(255, 255, 255, 0.16); }
    .drawer-close:active { transform: scale(0.94); }
    .drawer-close i { font-size: 18px; }
    .drawer-nav { display: flex; flex-direction: column; }
    .drawer-item {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(200, 188, 246, 0.15);
      padding: 22px 24px;
      color: var(--pure-white);
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      transition: background 200ms, padding-left 200ms;
    }
    .drawer-item:hover { background: rgba(200, 188, 246, 0.08); padding-left: 28px; }
    .drawer-item:active { background: rgba(200, 188, 246, 0.18); }
    .drawer-item i { color: var(--soft-lilac); font-size: 18px; opacity: 0.8; }
    .drawer-footer {
      margin-top: auto;
      padding: 24px 24px 8px;
      font-family: var(--font-ui);
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 254, 254, 0.5);
    }

    /* ============ Floating Cart FAB ============ */
    .cart-fab {
      position: absolute;
      bottom: 32px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--deep-violet);
      color: var(--pure-white);
      border: 1px solid rgba(200, 188, 246, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      box-shadow:
        0 12px 32px rgba(90, 25, 155, 0.5),
        0 0 0 6px rgba(90, 25, 155, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transform: scale(0) translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition:
        transform 480ms cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 280ms ease,
        box-shadow 200ms ease;
    }
    .cart-fab.visible {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .cart-fab:hover {
      background: var(--deep-violet-hover, #6B25B0);
      box-shadow:
        0 16px 38px rgba(90, 25, 155, 0.6),
        0 0 0 8px rgba(90, 25, 155, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .cart-fab:active.visible { transform: scale(0.94); }
    .cart-fab i { font-size: 24px; }
    .cart-fab-badge {
      position: absolute;
      top: -2px; right: -2px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--soft-lilac);
      color: var(--deep-indigo);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--deep-indigo);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }
    /* tiny pulse when count changes */
    @keyframes fab-bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .cart-fab.bump { animation: fab-bump 380ms ease; }

    .toast {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--soft-lilac);
      color: var(--deep-indigo);
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 10px 18px;
      border-radius: 999px;
      z-index: 55;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
    }
    .toast i { font-size: 14px; }

    /* ============ Tablet & Desktop — true responsive layout ============ */
    @media (min-width: 768px) {
      /* Constrain content to a centered column */
      .grid-intro,
      #product-grid { max-width: 1180px; margin-inline: auto; width: 100%; }
      .grid-intro { padding: 40px 32px 14px; }
      .grid-intro h1 { font-size: 40px; }
      .grid-intro p { font-size: 15px; }

      /* Sticky header content aligns to the same centered column */
      .sticky-bar { padding: 18px max(32px, calc((100vw - 1180px) / 2)); }
      .sticky-bar h2 { font-size: 20px; }

      /* 3-up product grid */
      #product-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 28px 24px;
        padding: 24px 32px 56px;
      }
      .product-name { font-size: 16px; }
      .product-price { font-size: 17px; }
      .add-btn { height: 40px; font-size: 14px; border-radius: var(--radius-pill); }

      /* Hero type scales up on larger canvases — container widens with it */
      .hero-text { max-width: min(640px, 62vw); }
      .display-headline { font-size: clamp(56px, 8vw, 92px); }
      .subline { font-size: 20px; }
    }

    @media (min-width: 1100px) {
      #product-grid { grid-template-columns: repeat(4, 1fr); }
      .grid-intro h1 { font-size: 48px; }
    }

    /* ============ Hero photo-wall mosaic (tablet & desktop) ============ */
    .hero-mosaic { display: none; }

    @media (min-width: 768px) {
      /* Reels are a phone interaction — swap in the animated photo wall */
      #reels-track, #touch-zone, .progress { display: none; }

      .hero-mosaic {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
        padding: 0 18px;
        z-index: 1; /* under .hero-scrim (z 2) so the headline stays readable */
        overflow: hidden;
        background: var(--medium-purple);
      }
      .mosaic-col { overflow: hidden; }
      .mosaic-track {
        display: flex;
        flex-direction: column;
        animation: mosaic-drift 52s linear infinite;
        will-change: transform;
      }
      .mosaic-tile {
        flex: none;
        width: 100%;
        aspect-ratio: 3 / 4;
        margin-bottom: 18px;
        border-radius: var(--radius-lg);
        background-size: cover;
        background-position: center;
        background-color: var(--dark-purple);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .mosaic-tile.sq { aspect-ratio: 1 / 1; }

      /* Stagger: alternating directions, varied speeds, phase offsets */
      .mosaic-col:nth-child(1) .mosaic-track { animation-duration: 52s; }
      .mosaic-col:nth-child(2) .mosaic-track { animation-direction: reverse; animation-duration: 64s; animation-delay: -18s; }
      .mosaic-col:nth-child(3) .mosaic-track { animation-duration: 58s; animation-delay: -30s; }
      .mosaic-col:nth-child(4) .mosaic-track { animation-direction: reverse; animation-duration: 47s; animation-delay: -9s; }

      @keyframes mosaic-drift {
        from { transform: translateY(0); }
        to   { transform: translateY(-50%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .mosaic-track { animation: none; }
      }
    }

    /* ============ Mobile (real device) ============ */
    @media (max-width: 460px) {
      html { -webkit-text-size-adjust: 100%; }
      body {
        padding: 0;
        gap: 0;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }
      body::after { display: none; }
      .device {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        min-height: 100dvh;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .device::after { display: none; }
      .screen { border-radius: 0; }
      .hint { display: none; }

      /* Hide the fake iPhone chrome on real devices (OS provides it) */
      .status-bar { display: none; }
      .home-indicator { display: none; }

      /* Hero section fills the real viewport */
      #hero-section { height: 100vh; height: 100dvh; }
      .grid-state { min-height: 100vh; min-height: 100dvh; }

      /* Top nav uses real safe area instead of fake status bar */
      .reels-nav { top: max(20px, env(safe-area-inset-top)); }
      .progress { top: max(8px, calc(env(safe-area-inset-top) - 4px)); }
      .sticky-bar {
        padding-top: max(20px, env(safe-area-inset-top));
        height: auto;
        min-height: 64px;
        padding-bottom: 12px;
      }
      .sticky-bar .center-title { top: auto; bottom: 14px; transform: translateX(-50%); }

      /* Cart FAB lifts above the home-indicator gesture area */
      .cart-fab {
        bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px));
      }

      /* Drawer corners flush with screen edges on mobile */
      .drawer { border-radius: 0; }
      .drawer-backdrop { border-radius: 0; }

      /* Scale headline on very wide-but-short phones via clamp */
      .display-headline { font-size: clamp(34px, 11vw, 46px); }
    }

    /* Tiny phones (≤360px width: SE 1st-gen, small Androids) */
    @media (max-width: 360px) {
      .display-headline { font-size: 30px; }
      .hero-text { left: 24px; bottom: 120px; max-width: 220px; }
      .product-grid { padding: 14px; gap: 14px 10px; }
      .product-card { border-radius: var(--radius-lg); }
      .card-name { font-size: 13px; }
      .card-price { font-size: 14px; }
      .reels-nav { padding: 0 16px; }
      .drawer { width: 82%; }
      .drawer-item { font-size: 18px; padding: 20px 22px; }
    }

    /* Landscape orientation: shrink hero text so it stays in frame */
    @media (max-width: 900px) and (orientation: landscape) {
      .display-headline { font-size: 32px; }
      .hero-text { bottom: 80px; max-width: 60%; }
      #scroll-cue { bottom: 24px; }
    }
  </style>
</head>
<body>

    <div class="screen">

<script>
  // ============ Hero photo-wall mosaic (tablet & desktop) ============
  (function buildMosaic() {
    const wrap = document.getElementById('hero-mosaic');
    if (!wrap) return;
    // 24 photos, 6 per column
    const cols = [
      ['hero-01.jpg', 'silk-scarf.jpg', 'charms-lifestyle-trim.jpg', 'star-boy.jpg', 'scarf-worn.jpg', 'sticker-sheet.jpg'],
      ['sticker-bag.jpg', 'satin-scrunchie.jpg', 'hero-02.jpg', 'speak-up.jpg', 'charms-set.jpg'],
      ['scrunchie-worn.jpg', 'keychain.jpg', 'sticker-applied.jpg', 'hero-03.jpg', 'star-girl.jpg', 'charms-lifestyle-square.jpg'],
      ['scarf-front.jpg', 'no-bad-hair-days.jpg', 'hero-04.jpg', 'charms-lifestyle-crop.jpg', 'IMG_2822 2.jpg']
    ];
    // which tile positions render square, per column (adds the staggered rhythm)
    const sq = [[1, 4], [0, 3], [2, 5], [1, 3]];
    cols.forEach((files, c) => {
      const col = document.createElement('div');
      col.className = 'mosaic-col';
      const track = document.createElement('div');
      track.className = 'mosaic-track';
      // sequence duplicated exactly so the -50% translate loops seamlessly
      [...files, ...files].forEach((f, i) => {
        const tile = document.createElement('div');
        tile.className = 'mosaic-tile' + (sq[c].includes(i % files.length) ? ' sq' : '');
        tile.style.backgroundImage = "url('assets/" + f + "')";
        track.appendChild(tile);
      });
      col.appendChild(track);
      wrap.appendChild(col);
    });
  })();

(function() {
  // ============ Products ============
  const products = [
    { name: 'Silk Scarf',       price: 12, img: 'assets/silk-scarf.jpg' },
    { name: 'Charm Keychain',   price: 5,  img: 'assets/keychain.jpg' },
    { name: 'Satin Scrunchie',  price: 7,  img: 'assets/satin-scrunchie.jpg' },
    { name: 'Sticker Sheet',    price: 8,  img: 'assets/sticker-sheet.jpg' },
    { name: 'B Mark',           price: 2,  img: 'assets/b-mark.jpg' },
    { name: 'Star Boy',         price: 2,  img: 'assets/star-boy.jpg' },
    { name: 'Star Girl',        price: 2,  img: 'assets/star-girl.jpg' },
    { name: 'No Bad Hair Days', price: 2,  img: 'assets/no-bad-hair-days.jpg' },
    { name: 'Speak Up',         price: 2,  img: 'assets/speak-up.jpg' },
    { name: 'Charm Add-On',     price: 2,  img: 'assets/charms-set.jpg', addon: true }
  ];

  const grid = document.getElementById('product-grid');
  products.forEach((p, i) => {
    if (p.addon) return; // add-ons are offered on their parent product's page, not in the grid
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-img" style="background-image: url('${p.img}');"></div>
      <div class="product-body">
        <p class="product-name">${p.name}</p>
        <p class="product-price">$${p.price}</p>
        <button class="add-btn" data-idx="${i}"><i class="ti ti-plus" style="font-size: 14px;"></i>Add</button>
      </div>
    `;
    grid.appendChild(card);
  });

  // ============ Cart state (shared via localStorage) ============
  // Stored as { [productIdx: string]: qty }
  const CART_KEY = 'braid_cart';
  function readCart() {
    try {
      const raw = localStorage.getItem(CART_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
    } catch { return {}; }
  }
  function writeCart(cart) {
    try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch {}
  }
  function addToCart(idx, qty) {
    const cart = readCart();
    const key = String(idx);
    cart[key] = (cart[key] || 0) + qty;
    writeCart(cart);
    return cart;
  }
  function getCartCount() {
    return Object.values(readCart()).reduce((s, q) => s + (q || 0), 0);
  }
  function cartSummary() {
    const cart = readCart();
    const entries = Object.entries(cart).filter(([, q]) => q > 0);
    const total = entries.reduce((s, [, q]) => s + q, 0);
    if (total === 0) return { total: 0, text: 'Cart is empty' };
    const parts = entries.slice(0, 2).map(([k, q]) => {
      const p = products[parseInt(k, 10)];
      return p ? `${p.name} ×${q}` : `Item ${k} ×${q}`;
    });
    const extra = entries.length > 2 ? `, +${entries.length - 2} more` : '';
    return { total, text: `${total} item${total > 1 ? 's' : ''} · ${parts.join(', ')}${extra}` };
  }
  let cartCount = getCartCount();
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toast-msg');
  let toastTimer = null;

  function showToast(msg) {
    toastMsg.textContent = msg;
    toast.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.style.transform = 'translateX(-50%) translateY(100px)';
    }, 1800);
  }

  const cartBtns = document.querySelectorAll('.js-cart-btn');
  const cartBadges = document.querySelectorAll('.js-cart-badge');

  function updateCartFab(animate = false) {
    cartBadges.forEach(badge => {
      badge.textContent = cartCount;
      badge.classList.toggle('visible', cartCount > 0);
    });
    if (animate && cartCount > 0) {
      cartBtns.forEach(btn => {
        btn.classList.remove('cart-bump');
        void btn.offsetWidth; // restart animation
        btn.classList.add('cart-bump');
      });
    }
  }

  document.querySelectorAll('.add-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx, 10);
      const p = products[idx];
      if (p.available === false || p.stock === 0) { showToast(`${p.name} · sold out`); return; }
      if (p.stock != null && (readCart()[String(idx)] || 0) >= p.stock) {
        showToast(`Only ${p.stock} in stock`); return;
      }
      addToCart(idx, 1);
      cartCount = getCartCount();
      updateCartFab(true);
      btn.classList.add('added');
      btn.innerHTML = '<i class="ti ti-check" style="font-size: 14px;"></i>Added';
      setTimeout(() => {
        btn.classList.remove('added');
        btn.innerHTML = '<i class="ti ti-plus" style="font-size: 14px;"></i>Add';
      }, 1500);
      showToast(`${p.name} · added`);
    });
  });

  document.querySelectorAll('.product-card').forEach((card, i) => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.add-btn')) return;
      window.location.href = `build-braid-flow-detail.html?idx=${i}`;
    });
  });

  // ============ Side drawer ============
  const drawer = document.getElementById('drawer');
  const drawerBackdrop = document.getElementById('drawer-backdrop');
  function openDrawer() {
    drawer.classList.add('open');
    drawerBackdrop.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    drawerBackdrop.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('menu-btn-hero').addEventListener('click', openDrawer);
  document.getElementById('menu-btn-grid').addEventListener('click', openDrawer);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  drawerBackdrop.addEventListener('click', closeDrawer);

  document.querySelectorAll('.drawer-item').forEach(item => {
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      closeDrawer();
      setTimeout(() => {
        if (action === 'cart') {
          window.location.href = 'build-braid-flow-cart.html';
        } else if (action === 'about') {
          showToast('About Braid');
        } else if (action === 'shipping') {
          window.location.href = 'build-braid-flow-shipping.html';
        }
      }, 280);
    });
  });

  // Header cart buttons → open cart page
  cartBtns.forEach(btn => btn.addEventListener('click', () => {
    window.location.href = 'build-braid-flow-cart.html';
  }));

  // Reflect persisted cart on load (e.g., user came back from detail page)
  updateCartFab();

  // ============ Reels carousel ============
  const track = document.getElementById('reels-track');
  const segments = document.querySelectorAll('.progress-seg');
  const fills = document.querySelectorAll('.progress-fill');
  const slideCount = 4;
  const slideDuration = 3000;
  let currentSlide = 0;
  let autoTimer = null;
  let progressStart = null;
  let progressFrame = null;
  let paused = false;

  function goToSlide(idx, restart = true) {
    currentSlide = (idx + slideCount) % slideCount;
    if (window.BraidFX && BraidFX.heroSlide) BraidFX.heroSlide(currentSlide);
    track.style.transform = `translateX(-${currentSlide * (100 / slideCount)}%)`;
    fills.forEach((f, i) => {
      if (i < currentSlide) f.style.width = '100%';
      else f.style.width = '0%';
    });
    if (restart && !paused) startAutoAdvance();
  }

  function startAutoAdvance() {
    clearTimeout(autoTimer);
    cancelAnimationFrame(progressFrame);
    progressStart = performance.now();
    const fill = fills[currentSlide];
    function step(now) {
      const elapsed = now - progressStart;
      const pct = Math.min(100, (elapsed / slideDuration) * 100);
      fill.style.width = pct + '%';
      if (pct < 100) progressFrame = requestAnimationFrame(step);
    }
    progressFrame = requestAnimationFrame(step);
    autoTimer = setTimeout(() => goToSlide(currentSlide + 1), slideDuration);
  }
  function pauseCarousel() {
    paused = true;
    clearTimeout(autoTimer);
    cancelAnimationFrame(progressFrame);
    autoTimer = null;
  }
  function resumeCarousel() {
    paused = false;
    if (!autoTimer) startAutoAdvance();
  }

  document.getElementById('tap-left').addEventListener('click', () => goToSlide(currentSlide - 1));
  document.getElementById('tap-right').addEventListener('click', () => goToSlide(currentSlide + 1));

  segments.forEach((seg, i) => {
    seg.addEventListener('click', (e) => { e.stopPropagation(); goToSlide(i); });
  });

  // Touch swipe
  let touchStartX = null;
  const heroSection = document.getElementById('hero-section');
  heroSection.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  heroSection.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) goToSlide(currentSlide + (dx < 0 ? 1 : -1));
    touchStartX = null;
  });

  // Scroll: pause carousel when in grid, hide scroll cue, toggle snap once in grid
  const scrollContainer = document.getElementById('scroll-container');
  const scrollCue = document.getElementById('scroll-cue');
  const heroHeight = heroSection.offsetHeight; // 820px
  // Track touch so snap never re-engages while a finger is on the glass —
  // flipping scroll-snap-type mid-gesture makes iOS jump the page.
  let touching = false, snapIdleTimer = null;
  scrollContainer.addEventListener('touchstart', () => { touching = true; }, { passive: true });
  window.addEventListener('touchend', () => {
    touching = false;
    armSnap(); // re-check once the finger lifts
  }, { passive: true });

  function armSnap() {
    clearTimeout(snapIdleTimer);
    snapIdleTimer = setTimeout(() => {
      const y = scrollContainer.scrollTop;
      if (!touching && y < heroHeight * 0.5) scrollContainer.classList.remove('snap-off');
    }, 160);
  }

  scrollContainer.addEventListener('scroll', () => {
    const y = scrollContainer.scrollTop;
    scrollCue.style.opacity = y > 60 ? '0' : '1';
    if (y > 600) pauseCarousel();
    else resumeCarousel();

    // Free scroll within the grid; re-arm the hero snap only after the
    // gesture fully settles (idle + finger lifted), never mid-scroll.
    if (y >= heroHeight) {
      scrollContainer.classList.add('snap-off');
    } else if (y < heroHeight * 0.5) {
      armSnap();
    }
  });

  scrollCue.addEventListener('click', () => {
    scrollContainer.scrollTo({ top: 820, behavior: 'smooth' });
  });

  // Let the FX layer pause/resume the reel during press-and-hold
  window.__braidHero = { pause: pauseCarousel, resume: resumeCarousel };

  // ============ Live inventory (Shopify Storefront API) ============
  window.__braidCatalog = {
    products,
    onSync() {
      document.querySelectorAll('.product-card').forEach(card => {
        const btn = card.querySelector('.add-btn');
        if (!btn) return;
        const p = products[parseInt(btn.dataset.idx, 10)];
        if (!p) return;
        const priceEl = card.querySelector('.product-price');
        if (priceEl) priceEl.textContent = '$' + p.price;
        let badge = card.querySelector('.stock-badge');
        const soldOut = p.available === false || p.stock === 0;
        const low = !soldOut && p.stock != null && p.stock <= 3;
        if (soldOut || low) {
          if (!badge) { badge = document.createElement('span'); badge.className = 'stock-badge'; card.appendChild(badge); }
          badge.textContent = soldOut ? 'Sold out' : `Only ${p.stock} left`;
          badge.classList.toggle('out', soldOut);
        } else if (badge) badge.remove();
        if (soldOut) { btn.disabled = true; btn.textContent = 'Sold out'; }
      });
    }
  };

  startAutoAdvance();
})();
</script>
