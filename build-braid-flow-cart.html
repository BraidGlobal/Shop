<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18172C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Build Braid — Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Roboto:wght@400;500;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.34.0/tabler-icons.min.css" />
  <style>
    :root {
      --deep-indigo: #18172C;
      --medium-purple: #302A4D;
      --dark-purple: #221E3C;
      --pure-white: #FFFEFE;
      --soft-lilac: #E2C5FF;
      --lavender: #C8BCF6;
      --deep-violet: #5A199B;
      --deep-violet-hover: #6B25B0;
      --purple-border: #9F75C7;
      --amber-orange: #FF9D33;

      --font-display: 'Sora', 'Inter', system-ui, sans-serif;
      --font-body: 'Roboto', system-ui, sans-serif;
      --font-ui: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--deep-indigo);
      color: var(--pure-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px 48px;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }
    body::after {
      content: '';
      position: absolute;
      inset: auto 0 0 0;
      height: 40%;
      background: radial-gradient(ellipse at 50% 0%, rgba(199, 188, 246, 0.05), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .hint {
      font-family: var(--font-ui);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(226, 197, 255, 0.5);
      text-align: center;
      max-width: 90%;
      z-index: 1;
    }

    /* ============ Device ============ */
    .device {
      width: 380px;
      height: 820px;
      background: #f8f8f8;
      border-radius: 56px;
      padding: 12px;
      box-shadow:
        0 50px 100px -20px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 1;
    }
    .device::after {
      content: '';
      position: absolute;
      left: 10%; right: 10%;
      bottom: -70px;
      height: 70px;
      background: linear-gradient(to bottom, rgba(248, 248, 248, 0.18), transparent);
      filter: blur(10px);
      transform: scaleY(-1);
      opacity: 0.4;
      pointer-events: none;
    }

    .screen {
      width: 100%; height: 100%;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      background: var(--deep-indigo);
    }

    /* ============ Status bar ============ */
    .status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      padding: 14px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 12px;
      color: var(--pure-white);
      z-index: 60;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(24, 23, 44, 0.55), transparent);
    }
    .status-bar .right { display: flex; align-items: center; gap: 5px; }
    .status-bar i { font-size: 14px; }

    /* ============ Scroll Container ============ */
    #scroll-container {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 116px;
    }
    #scroll-container::-webkit-scrollbar { display: none; }

    /* ============ Top Nav ============ */
    .top-nav {
      position: sticky;
      top: 0;
      height: 104px;
      padding: 44px 20px 0;
      background: rgba(24, 23, 44, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(159, 117, 199, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
    }
    .nav-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(226, 197, 255, 0.4);
      color: var(--soft-lilac);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .nav-btn:hover { border-color: rgba(226, 197, 255, 0.8); background: rgba(255, 255, 255, 0.04); }
    .nav-btn:active { transform: scale(0.94); }
    .nav-btn i { font-size: 18px; }
    .page-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      color: var(--pure-white);
      letter-spacing: -0.01em;
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
    }

    /* ============ Cart Body ============ */
    .cart-body {
      padding: 20px;
    }
    .cart-heading {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.02em;
      color: var(--pure-white);
      margin: 0 0 4px;
    }
    .cart-sub {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 13px;
      color: rgba(255, 254, 254, 0.6);
      margin: 0 0 22px;
    }

    /* ============ Line Items ============ */
    .line-items { display: flex; flex-direction: column; gap: 14px; }
    .line-item {
      display: flex;
      gap: 14px;
      padding: 12px;
      background:
        linear-gradient(160deg,
          rgba(226, 197, 255, 0.12) 0%,
          rgba(48, 42, 77, 0.55) 35%,
          rgba(34, 30, 60, 0.6) 100%);
      border: 1px solid rgba(226, 197, 255, 0.22);
      border-radius: 16px;
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
      animation: line-item-in 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes line-item-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .line-img {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      background-color: var(--dark-purple);
      cursor: pointer;
    }
    .line-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .line-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .line-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      color: var(--pure-white);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .line-remove {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(226, 197, 255, 0.25);
      color: rgba(226, 197, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .line-remove:hover {
      color: var(--pure-white);
      border-color: rgba(226, 197, 255, 0.6);
      background: rgba(226, 197, 255, 0.08);
    }
    .line-remove i { font-size: 14px; }
    .line-unit {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 12px;
      color: rgba(255, 254, 254, 0.55);
      margin-top: 2px;
    }
    .line-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .line-qty {
      display: flex;
      align-items: center;
      gap: 0;
      background: rgba(34, 30, 60, 0.7);
      border: 1px solid rgba(159, 117, 199, 0.3);
      border-radius: 10px;
      padding: 2px;
    }
    .qty-btn {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--soft-lilac);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .qty-btn:hover:not(:disabled) { background: rgba(226, 197, 255, 0.12); }
    .qty-btn:active:not(:disabled) { transform: scale(0.92); }
    .qty-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .qty-btn i { font-size: 14px; }
    .qty-value {
      min-width: 28px;
      text-align: center;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 14px;
      color: var(--pure-white);
    }
    .line-subtotal {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 16px;
      color: var(--soft-lilac);
    }

    /* ============ Empty State ============ */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 48px 20px 24px;
      gap: 8px;
    }
    .empty-state.visible { display: flex; }
    .empty-icon {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: rgba(226, 197, 255, 0.06);
      border: 1px solid rgba(226, 197, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(226, 197, 255, 0.5);
      margin-bottom: 14px;
    }
    .empty-icon i { font-size: 36px; }
    .empty-state h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
      color: var(--pure-white);
    }
    .empty-state p {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 14px;
      color: rgba(255, 254, 254, 0.6);
      max-width: 240px;
      margin-bottom: 18px;
    }
    .continue-btn {
      height: 44px;
      padding: 0 22px;
      border-radius: 12px;
      background: var(--deep-violet);
      color: var(--pure-white);
      border: none;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .continue-btn:hover { background: var(--deep-violet-hover); }
    .continue-btn:active { transform: scale(0.97); }
    .continue-btn i { font-size: 16px; }

    /* ============ Sticky Bottom Bar ============ */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 20px 24px;
      background: rgba(24, 23, 44, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(159, 117, 199, 0.25);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
      z-index: 45;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .bottom-bar.hidden { transform: translateY(110%); opacity: 0; pointer-events: none; }
    .totals { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .totals .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 13px;
      color: rgba(255, 254, 254, 0.7);
    }
    .totals .row.total {
      font-weight: 500;
      font-size: 16px;
      color: var(--pure-white);
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(159, 117, 199, 0.18);
    }
    .checkout-btn {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      background: var(--deep-violet);
      color: var(--pure-white);
      border: none;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .checkout-btn:hover { background: var(--deep-violet-hover); }
    .checkout-btn:active { transform: scale(0.97); }
    .checkout-btn i { font-size: 16px; }

    /* Home indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      border-radius: 999px;
      background: var(--pure-white);
      opacity: 0.85;
      z-index: 70;
      pointer-events: none;
    }

    /* Toast */
    .toast {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: var(--deep-violet);
      color: var(--pure-white);
      font-family: var(--font-ui);
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.02em;
      padding: 10px 18px;
      border-radius: 999px;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(90, 25, 155, 0.45);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* ============ Side Drawer ============ */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 320ms ease;
      border-radius: 44px;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 72%;
      background: rgba(90, 25, 155, 0.6);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border-left: 1px solid rgba(226, 197, 255, 0.25);
      box-shadow: -20px 0 50px rgba(0, 0, 0, 0.45);
      z-index: 85;
      transform: translateX(100%);
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      padding: 56px 0 32px;
      overflow: hidden;
      border-top-right-radius: 44px;
      border-bottom-right-radius: 44px;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 22px 22px;
      border-bottom: 1px solid rgba(226, 197, 255, 0.18);
    }
    .drawer-header img { height: 36px; filter: drop-shadow(0 1px 6px rgba(0, 0, 0, 0.35)); }
    .drawer-close {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(226, 197, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: var(--soft-lilac);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .drawer-close i { font-size: 18px; }
    .drawer-nav { display: flex; flex-direction: column; }
    .drawer-item {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(226, 197, 255, 0.15);
      padding: 22px 24px;
      color: var(--pure-white);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      transition: background 200ms, padding-left 200ms;
    }
    .drawer-item:hover { background: rgba(226, 197, 255, 0.08); padding-left: 28px; }
    .drawer-item:active { background: rgba(226, 197, 255, 0.18); }
    .drawer-item i { color: var(--soft-lilac); font-size: 18px; opacity: 0.8; }
    .drawer-footer {
      margin-top: auto;
      padding: 24px 24px 8px;
      font-family: var(--font-ui);
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 254, 254, 0.5);
    }

    /* ============ Mobile (real device) ============ */
    @media (max-width: 460px) {
      html { -webkit-text-size-adjust: 100%; }
      body {
        padding: 0;
        gap: 0;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }
      body::after { display: none; }
      .device {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        min-height: 100dvh;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .device::after { display: none; }
      .screen { border-radius: 0; }
      .hint { display: none; }
      .status-bar { display: none; }
      .home-indicator { display: none; }

      .top-nav {
        padding-top: max(12px, env(safe-area-inset-top));
        height: auto;
        min-height: 64px;
      }

      .bottom-bar {
        padding-bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px));
      }
      #scroll-container { padding-bottom: 132px; }
      .toast { bottom: 128px; }

      .drawer { border-radius: 0; }
      .drawer-backdrop { border-radius: 0; }

      .cart-heading { font-size: clamp(22px, 6.5vw, 26px); }
    }

    @media (max-width: 360px) {
      .cart-body { padding: 16px; }
      .line-item { padding: 10px; gap: 10px; }
      .line-img { width: 76px; height: 76px; }
      .line-name { font-size: 14px; }
      .line-subtotal { font-size: 15px; }
      .totals .row { font-size: 12px; }
      .totals .row.total { font-size: 15px; }
      .drawer { width: 82%; }
    }
  </style>
</head>
<body>

  <div class="hint">Cart · adjust quantities · checkout</div>

  <div class="device">
    <div class="screen">

      <!-- Status bar -->
      <div class="status-bar">
        <span>9:41</span>
        <div class="right">
          <i class="ti ti-antenna-bars-5"></i>
          <i class="ti ti-wifi"></i>
          <i class="ti ti-battery-3"></i>
        </div>
      </div>

      <div id="scroll-container">

        <!-- Top nav -->
        <nav class="top-nav">
          <button class="nav-btn" id="back-btn" aria-label="Back">
            <i class="ti ti-chevron-left"></i>
          </button>
          <span class="page-title">Cart</span>
          <button class="nav-btn" id="menu-btn" aria-label="Menu">
            <i class="ti ti-menu-2"></i>
          </button>
        </nav>

        <section class="cart-body">
          <h1 class="cart-heading">Your bag</h1>
          <p class="cart-sub" id="cart-sub">0 items</p>

          <!-- Empty state -->
          <div class="empty-state" id="empty-state">
            <div class="empty-icon">
              <i class="ti ti-shopping-bag"></i>
            </div>
            <h2>Your cart is empty</h2>
            <p>Add something you love to get started.</p>
            <button class="continue-btn" id="continue-btn">
              Continue shopping
              <i class="ti ti-arrow-right"></i>
            </button>
          </div>

          <!-- Line items -->
          <div class="line-items" id="line-items"></div>
        </section>

      </div>

      <!-- Sticky bottom bar -->
      <div class="bottom-bar" id="bottom-bar">
        <div class="totals">
          <div class="row">
            <span>Subtotal</span>
            <span id="subtotal">$0</span>
          </div>
          <div class="row">
            <span>Shipping</span>
            <span>Calculated at checkout</span>
          </div>
          <div class="row total">
            <span>Total</span>
            <span id="total">$0</span>
          </div>
        </div>
        <button class="checkout-btn" id="checkout-btn">
          Checkout
          <i class="ti ti-arrow-right"></i>
        </button>
      </div>

      <!-- Side drawer + backdrop -->
      <div class="drawer-backdrop" id="drawer-backdrop"></div>
      <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-header">
          <img src="assets/braid-logo.png" alt="Braid" />
          <button class="drawer-close" id="drawer-close" aria-label="Close menu">
            <i class="ti ti-x"></i>
          </button>
        </div>
        <nav class="drawer-nav">
          <button class="drawer-item" data-action="about">
            <span>About</span>
            <i class="ti ti-chevron-right"></i>
          </button>
          <button class="drawer-item" data-action="cart">
            <span>Cart</span>
            <i class="ti ti-chevron-right"></i>
          </button>
          <button class="drawer-item" data-action="shipping">
            <span>Shipping Policy</span>
            <i class="ti ti-chevron-right"></i>
          </button>
        </nav>
        <div class="drawer-footer">Braid · Hair care, curated</div>
      </aside>

      <!-- Home indicator -->
      <div class="home-indicator"></div>

      <!-- Toast -->
      <div class="toast" id="toast">
        <i class="ti ti-check"></i>
        <span id="toast-msg">Added to cart</span>
      </div>

    </div>
  </div>

<script>
(function() {
  // ============ Product catalog (shared with shop & detail) ============
  const PRODUCTS = [
    { name: 'Silk Scarf',       price: 38, img: 'assets/silk-scarf.jpg' },
    { name: 'Charm Keychain',   price: 24, img: 'assets/keychain.jpg' },
    { name: 'Satin Scrunchie',  price: 14, img: 'assets/satin-scrunchie.jpg' },
    { name: 'Sticker Sheet',    price: 12, img: 'assets/sticker-sheet.jpg' },
    { name: 'B Mark',           price: 4,  img: 'assets/b-mark.jpg' },
    { name: 'Star Boy',         price: 5,  img: 'assets/star-boy.jpg' },
    { name: 'Star Girl',        price: 5,  img: 'assets/star-girl.jpg' },
    { name: 'No Bad Hair Days', price: 4,  img: 'assets/no-bad-hair-days.jpg' },
    { name: 'Speak Up',         price: 5,  img: 'assets/speak-up.jpg' }
  ];

  // ============ Cart state (shared via localStorage) ============
  const CART_KEY = 'braid_cart';
  function readCart() {
    try {
      const raw = localStorage.getItem(CART_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
    } catch { return {}; }
  }
  function writeCart(cart) {
    try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch {}
  }
  function setQty(idx, qty) {
    const cart = readCart();
    const key = String(idx);
    if (qty <= 0) {
      delete cart[key];
    } else {
      cart[key] = qty;
    }
    writeCart(cart);
  }
  function getCartCount() {
    return Object.values(readCart()).reduce((s, q) => s + (q || 0), 0);
  }
  function getSubtotal() {
    const cart = readCart();
    return Object.entries(cart).reduce((sum, [k, q]) => {
      const p = PRODUCTS[parseInt(k, 10)];
      return sum + (p ? p.price * q : 0);
    }, 0);
  }
  function fmt(n) { return '$' + n; }

  // ============ Render ============
  const lineItemsEl = document.getElementById('line-items');
  const emptyStateEl = document.getElementById('empty-state');
  const cartSubEl = document.getElementById('cart-sub');
  const subtotalEl = document.getElementById('subtotal');
  const totalEl = document.getElementById('total');
  const bottomBar = document.getElementById('bottom-bar');

  function render() {
    const cart = readCart();
    const entries = Object.entries(cart).filter(([, q]) => q > 0);
    const total = entries.reduce((s, [, q]) => s + q, 0);

    if (entries.length === 0) {
      lineItemsEl.innerHTML = '';
      emptyStateEl.classList.add('visible');
      bottomBar.classList.add('hidden');
      cartSubEl.textContent = '0 items';
      return;
    }

    emptyStateEl.classList.remove('visible');
    bottomBar.classList.remove('hidden');
    cartSubEl.textContent = `${total} item${total > 1 ? 's' : ''} · ${entries.length} style${entries.length > 1 ? 's' : ''}`;

    // Build line items
    lineItemsEl.innerHTML = entries.map(([k, q]) => {
      const idx = parseInt(k, 10);
      const p = PRODUCTS[idx];
      if (!p) return '';
      const lineTotal = p.price * q;
      return `
        <article class="line-item" data-idx="${idx}">
          <div class="line-img" style="background-image: url('${p.img}');" data-action="open"></div>
          <div class="line-info">
            <div class="line-top">
              <div>
                <div class="line-name">${p.name}</div>
                <div class="line-unit">${fmt(p.price)} each</div>
              </div>
              <button class="line-remove" data-action="remove" aria-label="Remove">
                <i class="ti ti-x"></i>
              </button>
            </div>
            <div class="line-bottom">
              <div class="line-qty">
                <button class="qty-btn" data-action="dec" ${q <= 1 ? 'disabled' : ''} aria-label="Decrease">
                  <i class="ti ti-minus"></i>
                </button>
                <span class="qty-value">${q}</span>
                <button class="qty-btn" data-action="inc" ${q >= 99 ? 'disabled' : ''} aria-label="Increase">
                  <i class="ti ti-plus"></i>
                </button>
              </div>
              <div class="line-subtotal">${fmt(lineTotal)}</div>
            </div>
          </div>
        </article>
      `;
    }).join('');

    // Totals
    const sub = getSubtotal();
    subtotalEl.textContent = fmt(sub);
    totalEl.textContent = fmt(sub);
  }

  // ============ Interactions ============
  lineItemsEl.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const card = e.target.closest('.line-item');
    if (!card) return;
    const idx = parseInt(card.dataset.idx, 10);
    const cart = readCart();
    const currentQty = cart[String(idx)] || 0;
    const action = target.dataset.action;

    if (action === 'inc') {
      setQty(idx, currentQty + 1);
      render();
    } else if (action === 'dec') {
      setQty(idx, Math.max(0, currentQty - 1));
      render();
    } else if (action === 'remove') {
      setQty(idx, 0);
      render();
      showToast(`${PRODUCTS[idx]?.name || 'Item'} removed`);
    } else if (action === 'open') {
      window.location.href = `build-braid-flow-detail.html?idx=${idx}`;
    }
  });

  // ============ Toast ============
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toast-msg');
  let toastTimer = null;
  function showToast(msg) {
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // ============ Nav buttons ============
  document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = 'build-braid-flow-shop.html';
  });
  document.getElementById('continue-btn').addEventListener('click', () => {
    window.location.href = 'build-braid-flow-shop.html';
  });
  document.getElementById('checkout-btn').addEventListener('click', () => {
    showToast('Checkout · coming soon');
  });

  // ============ Drawer ============
  const drawer = document.getElementById('drawer');
  const drawerBackdrop = document.getElementById('drawer-backdrop');
  function openDrawer() {
    drawer.classList.add('open');
    drawerBackdrop.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    drawerBackdrop.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('menu-btn').addEventListener('click', openDrawer);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  drawerBackdrop.addEventListener('click', closeDrawer);
  document.querySelectorAll('.drawer-item').forEach(item => {
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      closeDrawer();
      setTimeout(() => {
        if (action === 'cart') {
          // already on cart page, just scroll to top
          document.getElementById('scroll-container').scrollTo({ top: 0, behavior: 'smooth' });
        } else if (action === 'about') {
          showToast('About Braid');
        } else if (action === 'shipping') {
          showToast('Shipping Policy');
        }
      }, 280);
    });
  });

  // Initial render
  render();
})();
</script>
</body>
</html>
